name: Five-hour form monitor

on:
  workflow_dispatch:
  schedule:
    # Runs at 00:17, 05:17, 10:17, 15:17, and 20:17 UTC.
    - cron: '17 */5 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: five-hour-form-monitor
  cancel-in-progress: false

jobs:
  test:
    # Pin the image so changes to ubuntu-latest cannot alter the test environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CYPRESS_liveSubmit: ${{ vars.LIVE_FORM_SUBMISSION || 'false' }}
      CYPRESS_testEmail: ${{ secrets.FORM_TEST_EMAIL || 'form-monitor@example.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run all 16 Cypress form checks
        id: cypress
        continue-on-error: true
        run: npm test
      - name: Publish run summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.cypress.outcome }}
        run: npm run report:summary
      - name: Upload screenshots and API results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: form-monitor-${{ github.run_id }}
          path: |
            cypress/screenshots
            cypress/results
          if-no-files-found: ignore
          retention-days: 7
      - name: Open a GitHub issue when monitoring fails
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Form monitor failure'
            const fs = require('fs')
            const failurePath = 'cypress/results/failures.json'
            const failures = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : []
            const details = failures.length
              ? failures.map((failure) => `- **${failure.test}**\n  ${failure.error.replace(/\n/g, '\n  ')}`).join('\n')
              : '- Cypress failed; open the run logs for details.'
            const body = `@${context.repo.owner} — the five-hour form monitor failed.\n\n### Failed forms and errors\n${details}\n\n[Open run logs, screenshots, and API evidence](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 20
            })
            const existing = issues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.addAssignees({ ...context.repo, issue_number: existing.number, assignees: [context.repo.owner] })
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, assignees: [context.repo.owner] })
            }
      - name: Email report to the team
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.cypress.outcome }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          REPORT_WEBHOOK_TOKEN: ${{ secrets.REPORT_WEBHOOK_TOKEN }}
        run: npm run report:email
