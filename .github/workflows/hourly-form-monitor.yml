name: Two-hour form monitor

on:
  workflow_dispatch:
  schedule:
    # Runs at minute 17 every second hour (UTC).
    - cron: '17 */2 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: two-hour-form-monitor
  cancel-in-progress: false

jobs:
  test:
    # Pin the image so changes to ubuntu-latest cannot alter the test environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CYPRESS_liveSubmit: ${{ vars.LIVE_FORM_SUBMISSION || 'false' }}
      CYPRESS_testEmail: ${{ secrets.FORM_TEST_EMAIL || 'form-monitor@example.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run all 16 Cypress form checks
        id: cypress
        continue-on-error: true
        run: npm test
      - name: Publish run summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.cypress.outcome }}
        run: |
          {
            echo "## UXArmy form monitor"
            echo
            echo "- Result: **${TEST_OUTCOME}**"
            echo "- Forms configured: **16**"
            echo "- Submission mode: **${CYPRESS_liveSubmit}**"
            echo "- Run: [Open logs and artifacts](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots and API results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: form-monitor-${{ github.run_id }}
          path: |
            cypress/screenshots
            cypress/results
          if-no-files-found: ignore
          retention-days: 7
      - name: Open a GitHub issue when monitoring fails
        if: steps.cypress.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Form monitor failure'
            const body = `The two-hour form monitor failed.\n\n[Open run logs and screenshots](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 20
            })
            const existing = issues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body })
            }
      - name: Email report to the team
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.cypress.outcome }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: npm run report:email
      - name: Fail workflow when Cypress failed
        if: steps.cypress.outcome == 'failure'
        run: exit 1
