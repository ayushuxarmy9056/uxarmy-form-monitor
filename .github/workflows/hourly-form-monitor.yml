name: Daily form monitor

on:
  workflow_dispatch:
  schedule:
    # Runs once a day at 00:17 UTC (5:47 AM India time).
    - cron: '17 0 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-form-monitor
  cancel-in-progress: false

jobs:
  test:
    # Pin the image so changes to ubuntu-latest cannot alter the test environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CYPRESS_liveSubmit: ${{ vars.LIVE_FORM_SUBMISSION || 'false' }}
      CYPRESS_testEmail: ${{ secrets.FORM_TEST_EMAIL || 'form-monitor@example.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run all 16 Cypress form checks
        id: cypress
        continue-on-error: true
        run: npm test
      - name: Publish run summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.cypress.outcome }}
        run: npm run report:summary
      - name: Upload screenshots and API results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: form-monitor-${{ github.run_id }}
          path: |
            cypress/screenshots
            cypress/results
          if-no-files-found: ignore
          retention-days: 7
      - name: Email report to the team
        id: email
        if: always()
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ steps.cypress.outcome }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          REPORT_WEBHOOK_TOKEN: ${{ secrets.REPORT_WEBHOOK_TOKEN }}
        run: npm run report:email
      - name: Post GitHub report notification
        if: always()
        uses: actions/github-script@v8
        env:
          CYPRESS_OUTCOME: ${{ steps.cypress.outcome }}
          EMAIL_OUTCOME: ${{ steps.email.outcome }}
        with:
          script: |
            const title = 'Daily form monitor reports'
            const fs = require('fs')
            const failurePath = 'cypress/results/failures.json'
            const failures = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : []
            const details = failures.length
              ? `\n\n### Failed forms and errors\n${failures.map((failure) => `- **${failure.test}**\n  ${failure.error.replace(/\n/g, '\n  ')}`).join('\n')}`
              : ''
            const formStatus = process.env.CYPRESS_OUTCOME === 'success' ? '✅ PASS' : '❌ FAIL'
            const emailStatus = process.env.EMAIL_OUTCOME === 'success' ? '✅ SENT' : '❌ NOT SENT'
            const body = `@${context.repo.owner} — daily form monitor report.\n\n- **Forms:** ${formStatus}\n- **Email report:** ${emailStatus}${details}\n\n[Open run logs, screenshots, and API evidence](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100
            })
            const existing = issues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.addAssignees({ ...context.repo, issue_number: existing.number, assignees: [context.repo.owner] })
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, assignees: [context.repo.owner] })
            }
      - name: Fail workflow when email delivery failed
        if: steps.email.outcome == 'failure'
        run: exit 1
